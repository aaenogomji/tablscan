name: sync

on:
  schedule:
    # каждые 10 минут (UTC); GitHub может задерживать запуск на 3-15 минут
    - cron: "*/10 * * * *"
  # кнопка ручного запуска для первой проверки
  workflow_dispatch: {}

permissions:
  contents: write   # право бота коммитить результаты в репозиторий

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: run script
        env:
          FUNPAY_DATA_DIR: funpay_data
          FUNPAY_STATS_DIR: funpay_stats
        run: python funpay_monitor.py

      - name: save results
        if: always()
        run: |
          git config user.name "sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update $(TZ=Europe/Moscow date '+%d.%m %H:%M')"
            git push
          fi
